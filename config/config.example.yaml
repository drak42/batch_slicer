# BatchSlicer configuration.
#
# BatchSlicer looks for its configuration in this order:
#   1. the file given with --config PATH
#   2. the file named by the BATCHSLICER_CONFIG environment variable
#   3. config/config.yaml in the current folder (a project checkout)
#   4. ~/.config/batchslicer/config.yaml (the usual place for an installed copy)
#
# Copy this file to one of those places (or run `batchslicer setup`) and fill
# in the slicers you use. Paths may start with ~ for your home folder; relative
# paths are relative to the folder this file is in.

# Slicers. Set both paths for each slicer you want to use; leave the others
# empty. executable is the slicer program (for example its AppImage); datadir is
# the folder where the slicer keeps its settings and presets.
orca:
  executable: ""     # e.g. ~/Apps/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.2.AppImage
  datadir: ""        # e.g. ~/.config/OrcaSlicer

creality_print:
  executable: ""     # e.g. ~/Apps/CrealityPrint-V7.3.0.6157-x86_64-Release.AppImage
  datadir: ""        # e.g. ~/.config/Creality/Creality Print/7.3

bambu_studio:
  executable: ""     # e.g. ~/Apps/BambuStudio_ubu24-v02.09.01.70-20261103183404.AppImage
  datadir: ""        # e.g. ~/.config/BambuStudio

# Folders. All optional; remove or leave empty to use the defaults shown.
paths:
  incoming: ""       # models offered for slicing   (default ~/BatchSlicer/incoming)
  output: ""         # default output folder        (default ~/BatchSlicer/output)
  logs: ""           # log files                    (default ~/.local/state/batchslicer)
  data: ""           # BatchSlicer's working cache  (default ~/.cache/batchslicer)
  profiles: ""       # saved profiles file          (default ~/.local/share/batchslicer/profiles.yaml)

# Printers to send G-code to with --send NAME (--send also takes an address
# such as 192.168.1.50 directly, without any of this): Klipper printers running
# Moonraker (Creality K1/K2 series, Voron, Prusa with Klipper, ...). url is
# Moonraker's address, usually port 7125; api_key is only needed if Moonraker
# asks for one. Remove the # to use it.
# printers:
#   k2plus:
#     url: "http://192.168.1.50:7125"
#     api_key: ""
