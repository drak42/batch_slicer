name: Feature request
description: Suggest something BatchSlicer could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working (an option, a question in the interactive run, ...).
  - type: input
    id: setup
    attributes:
      label: Your setup
      placeholder: OrcaSlicer 2.5, Creality K2 Plus, Linux
