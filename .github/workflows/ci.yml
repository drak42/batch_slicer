# Run the checks on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]' build twine

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest

      - name: Build package
        run: |
          python -m build
          twine check --strict dist/*
