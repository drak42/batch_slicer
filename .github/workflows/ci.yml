# Run the checks on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Branch protection on main requires every job by name: "Python 3.x" (Linux),
    # "Windows, Python 3.x" and "macOS, Python 3.x". Renaming a job means
    # updating the required checks too.
    name: ${{ matrix.os == 'windows-latest' && format('Windows, Python {0}', matrix.python-version) || matrix.os == 'macos-latest' && format('macOS, Python {0}', matrix.python-version) || format('Python {0}', matrix.python-version) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash  # the same commands on Linux, macOS and Windows (Git Bash)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]' build twine

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest

      - name: Build package
        run: |
          python -m build
          twine check --strict dist/*
