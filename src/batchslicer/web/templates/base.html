<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <meta name="batchslicer-token" content="{{ token }}">
  <title>{% block title %}BatchSlicer{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/upload.js" defer></script>
</head>
<body hx-headers='{"X-BatchSlicer-Token": "{{ token }}"}'>
  <header class="top">
    <a class="brand" href="/">BatchSlicer</a>
    <span class="muted">{{ version }}</span>
    <nav>
      <a href="/">Queue and results</a>
      <a href="/printers">Printers</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
