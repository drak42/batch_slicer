[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "BatchSlicer"
version = "0.1.0"
description = "Print automation platform centred around OrcaSlicer."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "types-PyYAML>=6.0",
]

[project.scripts]
batchslicer = "batchslicer.app:main"

[project.urls]
Repository = "https://github.com/drak42/batch_slicer"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["batchslicer*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Errors and undefined names (E, F), import order (I) and likely bugs (B).
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
