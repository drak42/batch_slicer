[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "OrcaBatch"
version = "0.1.0"
description = "Print automation platform centred around OrcaSlicer."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/drak42/batch_slicer"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["orcabatch*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
