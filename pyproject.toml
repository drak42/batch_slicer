[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "BatchSlicer"
dynamic = ["version"]
description = "Batch-slice 3D models with OrcaSlicer, Creality Print or Bambu Studio using your own presets, and send the G-code to Klipper or OctoPrint printers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christopher Eslick" }]
keywords = ["3d-printing", "slicer", "batch", "orcaslicer", "creality-print", "bambu-studio", "gcode", "klipper", "moonraker", "octoprint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Manufacturing",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Printing",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
    "starlette>=0.40",
    "python-multipart>=0.0.18",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "types-PyYAML>=6.0",
]

[project.scripts]
batchslicer = "batchslicer.app:main"

[project.urls]
Homepage = "https://github.com/drak42/batch_slicer"
Repository = "https://github.com/drak42/batch_slicer"
Issues = "https://github.com/drak42/batch_slicer/issues"
Changelog = "https://github.com/drak42/batch_slicer/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "batchslicer.version.__version__" }

[tool.setuptools.package-data]
batchslicer = ["py.typed", "web/templates/*.html", "web/static/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["batchslicer*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Errors and undefined names (E, F), import order (I), likely bugs (B), and
# invalid escape sequences such as "\B" in a Windows path (W605).
select = ["E4", "E7", "E9", "F", "I", "B", "W605"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
